spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/fiscalanalyzer
    username: fiscalanalyzer
    password: fiscalanalyzer
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

  rabbitmq:
    host: localhost
    port: 5672
    username: fiscalanalyzer
    password: fiscalanalyzer

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  importacao:
    max-zip-size: 200MB
  sped:
    max-upload-size: 300MB
    max-txt-size: 50MB
  queue:
    exchange: import.exchange
    dlx: import.dlx
    extract-zip: import.extract
    extract-dlq: import.extract.dlq
    parse-xml: import.parse
    parse-dlq: import.parse.dlq
    parse-sped: import.sped.parse
    parse-sped-dlq: import.sped.parse.dlq
    listener:
      sped:
        concurrency: 1
        max-concurrency: 2
        prefetch: 10
    retry:
      max-attempts: 5
      initial-interval: 1000
      multiplier: 2.0
      max-interval: 30000

storage:
  s3:
    endpoint: ${STORAGE_S3_ENDPOINT}
    access-key: ${STORAGE_S3_ACCESS_KEY}
    secret-key: ${STORAGE_S3_SECRET_KEY}
    bucket: ${STORAGE_S3_BUCKET}
    region: ${STORAGE_S3_REGION:us-east-1}
    path-style-access: ${STORAGE_S3_PATH_STYLE_ACCESS:false}
