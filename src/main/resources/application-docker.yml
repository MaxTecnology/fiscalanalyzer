spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/fiscalanalyzer}
    username: ${DB_USERNAME:fiscalanalyzer}
    password: ${DB_PASSWORD:fiscalanalyzer}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:fiscalanalyzer}
    password: ${RABBITMQ_PASSWORD:fiscalanalyzer}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  importacao:
    max-zip-size: 200MB
  queue:
    exchange: import.exchange
    dlx: import.dlx
    extract-zip: import.extract
    extract-dlq: import.extract.dlq
    parse-xml: import.parse
    parse-dlq: import.parse.dlq
    retry:
      max-attempts: 5
      initial-interval: 1000
      multiplier: 2.0
      max-interval: 30000

storage:
  s3:
    endpoint: ${STORAGE_S3_ENDPOINT}
    access-key: ${STORAGE_S3_ACCESS_KEY}
    secret-key: ${STORAGE_S3_SECRET_KEY}
    bucket: ${STORAGE_S3_BUCKET}
    region: ${STORAGE_S3_REGION:us-east-1}
    path-style-access: ${STORAGE_S3_PATH_STYLE_ACCESS:false}
