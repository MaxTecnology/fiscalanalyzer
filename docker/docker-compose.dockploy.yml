services:
  postgres:
    image: postgres:16
    container_name: fiscalanalyzer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fiscalanalyzer}
      POSTGRES_USER: ${POSTGRES_USER:-fiscalanalyzer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fiscalanalyzer}
    volumes:
      - fiscalanalyzer_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fiscalanalyzer} -d ${POSTGRES_DB:-fiscalanalyzer}"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3-management
    container_name: fiscalanalyzer-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-fiscalanalyzer}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-fiscalanalyzer}
    volumes:
      - fiscalanalyzer_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: fiscalanalyzer-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - fiscalanalyzer_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: fiscalanalyzer-app
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-fiscalanalyzer}
      DB_USERNAME: ${POSTGRES_USER:-fiscalanalyzer}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-fiscalanalyzer}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-fiscalanalyzer}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-fiscalanalyzer}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT}
      STORAGE_S3_ACCESS_KEY: ${STORAGE_S3_ACCESS_KEY}
      STORAGE_S3_SECRET_KEY: ${STORAGE_S3_SECRET_KEY}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-us-east-1}
      STORAGE_S3_PATH_STYLE_ACCESS: ${STORAGE_S3_PATH_STYLE_ACCESS:-false}
      APP_SECURITY_BOOTSTRAP_TOKEN: ${APP_SECURITY_BOOTSTRAP_TOKEN:-}
      APP_SECURITY_JWT_SECRET: ${APP_SECURITY_JWT_SECRET:-}
      APP_SECURITY_JWT_ACCESS_TOKEN_TTL_SECONDS: ${APP_SECURITY_JWT_ACCESS_TOKEN_TTL_SECONDS:-3600}
      APP_SECURITY_RATE_LIMIT_BACKEND: ${APP_SECURITY_RATE_LIMIT_BACKEND:-redis}
      APP_SECURITY_AUTH_AUDIT_MODE: ${APP_SECURITY_AUTH_AUDIT_MODE:-failures}
      APP_SECURITY_AUDIT_CLEANUP_ENABLED: ${APP_SECURITY_AUDIT_CLEANUP_ENABLED:-true}
      APP_SECURITY_AUDIT_CLEANUP_CRON: ${APP_SECURITY_AUDIT_CLEANUP_CRON:-0 30 3 * * *}
      APP_SECURITY_AUDIT_CLEANUP_AUTH_RETENTION_DAYS: ${APP_SECURITY_AUDIT_CLEANUP_AUTH_RETENTION_DAYS:-90}
      APP_SECURITY_AUDIT_CLEANUP_UPLOAD_RETENTION_DAYS: ${APP_SECURITY_AUDIT_CLEANUP_UPLOAD_RETENTION_DAYS:-30}
      APP_SECURITY_AUDIT_CLEANUP_BATCH_SIZE: ${APP_SECURITY_AUDIT_CLEANUP_BATCH_SIZE:-5000}
      APP_SECURITY_AUDIT_CLEANUP_MAX_BATCHES: ${APP_SECURITY_AUDIT_CLEANUP_MAX_BATCHES:-100}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  fiscalanalyzer_pgdata:
  fiscalanalyzer_rabbitmq_data:
  fiscalanalyzer_redis_data:
