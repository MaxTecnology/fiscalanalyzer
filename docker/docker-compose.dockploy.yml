services:
  postgres:
    image: postgres:16
    container_name: fiscalanalyzer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fiscalanalyzer}
      POSTGRES_USER: ${POSTGRES_USER:-fiscalanalyzer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fiscalanalyzer}
    volumes:
      - fiscalanalyzer_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fiscalanalyzer} -d ${POSTGRES_DB:-fiscalanalyzer}"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3-management
    container_name: fiscalanalyzer-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-fiscalanalyzer}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-fiscalanalyzer}
    volumes:
      - fiscalanalyzer_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: fiscalanalyzer-app
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-fiscalanalyzer}
      DB_USERNAME: ${POSTGRES_USER:-fiscalanalyzer}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-fiscalanalyzer}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-fiscalanalyzer}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-fiscalanalyzer}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT}
      STORAGE_S3_ACCESS_KEY: ${STORAGE_S3_ACCESS_KEY}
      STORAGE_S3_SECRET_KEY: ${STORAGE_S3_SECRET_KEY}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-us-east-1}
      STORAGE_S3_PATH_STYLE_ACCESS: ${STORAGE_S3_PATH_STYLE_ACCESS:-false}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  fiscalanalyzer_pgdata:
  fiscalanalyzer_rabbitmq_data:
