services:
  postgres:
    image: postgres:16
    container_name: fiscalanalyzer-postgres
    environment:
      POSTGRES_DB: fiscalanalyzer
      POSTGRES_USER: fiscalanalyzer
      POSTGRES_PASSWORD: fiscalanalyzer
    ports:
      - "5432:5432"
    volumes:
      - fiscalanalyzer_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fiscalanalyzer -d fiscalanalyzer"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3-management
    container_name: fiscalanalyzer-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: fiscalanalyzer
      RABBITMQ_DEFAULT_PASS: fiscalanalyzer
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: fiscalanalyzer-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  fiscalanalyzer_pgdata:
